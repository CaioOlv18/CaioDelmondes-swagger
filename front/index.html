<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Biblioteca Universitária</a>
            <span class="navbar-text text-white">Sistema de materiais</span>
        </div>
    </nav>

    <main class="container py-4">
        <section class="mb-4">
            <h1 class="h3 fw-bold">Gerenciamento da biblioteca</h1>
            <p class="text-secondary mb-0">Consulte, cadastre e gerencie livros e revistas.</p>
        </section>

        <div id="mensagens" class="mb-3" aria-live="polite"></div>

        <section class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card resumo-card h-100">
                    <div class="card-body">
                        <p class="text-secondary mb-1">Total de materiais</p>
                        <h2 id="totalMateriais" class="display-6 fw-bold mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="card resumo-card h-100">
                    <div class="card-body">
                        <p class="text-secondary mb-1">Livros</p>
                        <h2 id="totalLivros" class="display-6 fw-bold mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="card resumo-card h-100">
                    <div class="card-body">
                        <p class="text-secondary mb-1">Revistas</p>
                        <h2 id="totalRevistas" class="display-6 fw-bold mb-0">0</h2>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h2 class="h5 mb-0">Cadastrar material</h2>
                <span class="badge text-bg-primary">Novo cadastro</span>
            </div>
            <div class="card-body">
                <form id="formCadastro">
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="tipoCadastro" class="form-label">Tipo de material</label>
                            <select id="tipoCadastro" class="form-select" required>
                                <option value="livro">Livro</option>
                                <option value="revista">Revista</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-8">
                            <label for="tituloCadastro" class="form-label">Título</label>
                            <input type="text" id="tituloCadastro" class="form-control" maxlength="150" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="anoCadastro" class="form-label">Ano de publicação</label>
                            <input type="number" id="anoCadastro" class="form-control" min="1" max="2100" required>
                        </div>

                        <div class="col-12 col-md-4 campo-livro">
                            <label for="autorCadastro" class="form-label">Autor</label>
                            <input type="text" id="autorCadastro" class="form-control">
                        </div>
                        <div class="col-12 col-md-4 campo-livro">
                            <label for="paginasCadastro" class="form-label">Número de páginas</label>
                            <input type="number" id="paginasCadastro" class="form-control" min="1">
                        </div>

                        <div class="col-12 col-md-4 campo-revista d-none">
                            <label for="edicaoCadastro" class="form-label">Número da edição</label>
                            <input type="number" id="edicaoCadastro" class="form-control" min="1">
                        </div>
                        <div class="col-12 col-md-4 campo-revista d-none">
                            <label for="mesCadastro" class="form-label">Mês de publicação</label>
                            <input type="number" id="mesCadastro" class="form-control" min="1" max="12" placeholder="1 a 12">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Cadastrar material</button>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h2 class="h5 mb-0">Materiais cadastrados</h2>
                <button id="btnAtualizar" class="btn btn-outline-primary btn-sm" type="button">Atualizar lista</button>
            </div>
            <div class="card-body">
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-8">
                        <label for="busca" class="form-label">Pesquisar pelo título</label>
                        <input type="search" id="busca" class="form-control" placeholder="Digite o título...">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="consultaId" class="form-label">Consultar material por ID</label>
                        <div class="input-group">
                            <input type="number" id="consultaId" class="form-control" min="1" placeholder="ID">
                            <button id="btnConsultarId" class="btn btn-outline-secondary" type="button">Consultar</button>
                        </div>
                    </div>
                </div>
                <div id="resultadoId" class="mb-3"></div>
                <div id="listaMateriais" class="row g-3">
                    <div class="col-12 text-center text-secondary py-4">Carregando materiais...</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalEdicao" tabindex="-1" aria-labelledby="tituloModalEdicao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="formEdicao">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="tituloModalEdicao">Editar material</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="idEdicao">
                        <input type="hidden" id="tipoEdicao">
                        <div class="mb-3">
                            <label for="tituloEdicao" class="form-label">Título</label>
                            <input type="text" id="tituloEdicao" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="anoEdicao" class="form-label">Ano de publicação</label>
                            <input type="number" id="anoEdicao" class="form-control" min="1" max="2100" required>
                        </div>
                        <div id="camposEdicaoLivro">
                            <div class="mb-3">
                                <label for="autorEdicao" class="form-label">Autor</label>
                                <input type="text" id="autorEdicao" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="paginasEdicao" class="form-label">Número de páginas</label>
                                <input type="number" id="paginasEdicao" class="form-control" min="1">
                            </div>
                        </div>
                        <div id="camposEdicaoRevista" class="d-none">
                            <div class="mb-3">
                                <label for="edicaoEdicao" class="form-label">Número da edição</label>
                                <input type="number" id="edicaoEdicao" class="form-control" min="1">
                            </div>
                            <div class="mb-3">
                                <label for="mesEdicao" class="form-label">Mês de publicação</label>
                                <input type="number" id="mesEdicao" class="form-control" min="1" max="12">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
